# Firebase App Hosting 설정 (체험용 프로토타입)
# 데이터는 서버의 임시 폴더에 저장되므로, 서버가 재시작되면 데모 데이터로 초기화됩니다.
# 서버를 1대로 고정해 모든 체험자가 같은 데이터를 보도록 합니다.
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: DATA_DIR
    value: /tmp/geungeo-note
  - variable: DEMO_LOGIN
    value: "on"
  # 실제 AI 생성을 켜려면 Firebase 콘솔에서 비밀값을 만든 뒤 아래 주석을 풉니다.
  #   firebase apphosting:secrets:set ANTHROPIC_API_KEY
  # - variable: ANTHROPIC_API_KEY
  #   secret: ANTHROPIC_API_KEY
